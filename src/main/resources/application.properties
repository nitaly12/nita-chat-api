spring.application.name=chat

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

chat.app.jwtSecret=${JWT_SECRET:45NbTmtErOz8EgXVZka6cFJW1MTF/SNinoyyu7cUQuI=}
chat.app.jwtExpirationMs=3600000
chat.app.jwtRefreshExpirationMs=604800000

chat.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://your-app.vercel.app,http://localhost:3000}
